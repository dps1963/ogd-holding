<style>
  :root{--sea:#0E1B38;--page:#070f22;--surface:#16295A;--gold:#F0B23F;--gold-deep:#D9971F;
        --gold-ripple:#F5C15A;--gold-soft:#FFD98A;--wordmark:#6E9BFF;--ink:#EAF0FF}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:var(--page);color:var(--ink);
       font:17px/1.6 "Segoe UI",system-ui,-apple-system,sans-serif;
       display:flex;flex-direction:column;align-items:center;justify-content:center;
       min-height:100vh;text-align:center;padding:24px;overflow:hidden;position:relative}
  .ripples{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .r{position:absolute;border:2px solid var(--gold-ripple);border-radius:50%;
     opacity:0;animation:ripple 7s ease-out infinite}
  @keyframes ripple{0%{transform:scale(.05);opacity:.55}70%{opacity:.12}100%{transform:scale(1);opacity:0}}
  @media (prefers-reduced-motion: reduce){.r{animation:none;opacity:.08;transform:scale(.6)}}
  main{position:relative;max-width:620px;display:flex;flex-direction:column;align-items:center;gap:18px}
  .globe{width:104px;height:104px;filter:drop-shadow(0 4px 20px rgba(240,178,63,.35))}
  h1{font-size:clamp(1.7rem,5.5vw,2.5rem);letter-spacing:.01em;font-weight:700;text-wrap:balance}
  h1 .com{color:var(--wordmark)}
  .tag{color:var(--gold-soft);font-size:clamp(1.02rem,3.4vw,1.25rem)}
  .soon{background:var(--surface);border:1px solid rgba(240,178,63,.35);border-radius:999px;
        padding:7px 20px;font-size:.86rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
  p.body{color:#B9C6E4;max-width:46ch}
  .cta{display:inline-block;background:var(--gold);color:var(--sea);font-weight:700;
       text-decoration:none;border-radius:12px;padding:13px 30px;font-size:1.05rem;margin-top:6px;
       transition:background .15s ease}
  .cta:hover{background:var(--gold-soft)} .cta:focus-visible{outline:3px solid var(--gold-soft);outline-offset:3px}
  footer{position:relative;margin-top:44px;color:#7A8BB0;font-size:.82rem;line-height:1.7}
  footer a{color:#9FB4E0;text-decoration:none} footer a:hover{text-decoration:underline}
</style>
</head>
