name: Central legal conformance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  legal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/legal/verify.py
      - name: Production legal release is adopted and effective
        # The served branch is codex/family-websites-20260917 (live), so it is gated like main.
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/family-websites-20260917'
        run: python3 tools/legal/verify.py --release
